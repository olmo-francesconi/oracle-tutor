<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oracle Tutor — Home (Design Preview)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F0EDE6;
      --surface: #FFFFFF;
      --ink:     #111111;
      --red:     #CC1100;
      --yellow:  #F5C400;
      --muted:   #7A7670;
      --border:  2px solid #111111;
      --font-display: 'Big Shoulders Display', sans-serif;
      --font-mono:    'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-mono);
      overflow-x: hidden;
    }

    /* ── Red left stripe ── */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 6px;
      height: 100%;
      background: var(--red);
      z-index: 100;
    }

    /* ── Geometric background accents ── */
    .geo-red {
      position: fixed;
      top: -80px; right: -60px;
      width: 260px; height: 340px;
      background: var(--red);
      opacity: 0.08;
      z-index: 0;
    }
    .geo-yellow {
      position: fixed;
      bottom: 40px; right: 80px;
      width: 40px; height: 140px;
      background: var(--yellow);
      opacity: 0.6;
      z-index: 0;
    }
    .geo-ink {
      position: fixed;
      bottom: -20px; left: 40px;
      width: 120px; height: 4px;
      background: var(--ink);
      opacity: 0.12;
      z-index: 0;
    }

    /* ── Main layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 80px 40px;
    }

    .wordmark {
      text-align: center;
      margin-bottom: 40px;
    }

    .wordmark h1 {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(64px, 12vw, 108px);
      line-height: 0.92;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-transform: uppercase;
    }

    .wordmark .rule {
      width: 100%;
      height: 2px;
      background: var(--ink);
      margin: 14px 0 12px;
    }

    .wordmark p {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ── Search box ── */
    .search-wrap {
      width: 100%;
      max-width: 560px;
      position: relative;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      border: var(--border);
      background: var(--surface);
      padding: 18px 20px;
      cursor: text;
    }

    .search-box svg {
      width: 20px; height: 20px;
      flex-shrink: 0;
      color: var(--ink);
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--font-mono);
      font-size: 16px;
      color: var(--ink);
    }
    .search-box input::placeholder { color: #ABABAB; }

    /* ── Dropdown ── */
    .dropdown {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      border: var(--border);
      border-top: none;
      background: var(--surface);
      z-index: 200;
      display: none;
    }
    .dropdown.open { display: block; }

    .section-label {
      padding: 8px 20px 6px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid #E8E5DE;
    }
    .section-label.semantic { color: #8B7A00; }

    .dd-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--ink);
      border-bottom: 1px solid #F0EDE6;
      cursor: pointer;
      transition: background 0.08s, color 0.08s;
      user-select: none;
    }
    .dd-item:last-child { border-bottom: none; }
    .dd-item:hover { background: var(--ink); color: #FFFFFF; }
    .dd-item .type-tag {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
    }
    .dd-item:hover .type-tag { color: #AAAAAA; }

    .dd-divider {
      height: 2px;
      background: var(--yellow);
    }

    .dd-item.all-results {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-top: var(--border);
      padding: 14px 20px;
    }
    .dd-item.all-results .arrow { font-size: 16px; }

    .loading-tag {
      font-size: 11px;
      color: #ABABAB;
      font-style: italic;
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Footer hint ── */
    .hint {
      position: fixed;
      bottom: 20px;
      left: 40px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Preview label ── */
    .preview-badge {
      position: fixed;
      top: 12px;
      right: 16px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: var(--ink);
      color: var(--bg);
      padding: 4px 10px;
      z-index: 999;
    }

    /* ── Demo toggle buttons ── */
    .demo-controls {
      margin-top: 32px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .demo-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 8px 14px;
      border: var(--border);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.08s, color 0.08s;
    }
    .demo-btn:hover { background: var(--ink); color: #fff; }
    .demo-btn.active { background: var(--ink); color: #fff; }
  </style>
</head>
<body>

  <div class="geo-red"></div>
  <div class="geo-yellow"></div>
  <div class="geo-ink"></div>
  <div class="preview-badge">Design Preview</div>

  <div class="page">
    <div class="wordmark">
      <h1>Oracle<br/>Tutor</h1>
      <div class="rule"></div>
      <p>find cards by meaning, not keywords.</p>
    </div>

    <div class="search-wrap">
      <div class="search-box" onclick="document.getElementById('q').focus()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="q" type="text" placeholder="search for a card or describe what it does..." oninput="handleInput(this.value)" onfocus="if(currentState) openDropdown()" onkeydown="handleKey(event)" autocomplete="off" />
      </div>

      <div class="dropdown" id="dropdown">
        <!-- Populated by JS -->
      </div>
    </div>

    <div class="demo-controls">
      <button class="demo-btn" onclick="simulateState('empty')">Empty</button>
      <button class="demo-btn" onclick="simulateState('name-only')">Name matches only</button>
      <button class="demo-btn active" onclick="simulateState('both')">Name + Semantic</button>
      <button class="demo-btn" onclick="simulateState('loading')">Semantic loading...</button>
      <button class="demo-btn" onclick="simulateState('semantic-only')">Semantic only</button>
    </div>
  </div>

  <div class="hint">press enter → semantic search &nbsp;·&nbsp; click card → card detail</div>

  <script>
    const STATES = {
      'empty': null,
      'name-only': {
        query: 'lightning',
        names: ['Lightning Bolt', 'Lightning Strike', 'Lightning Helix', 'Lightning Greaves'],
        semantic: [],
        loadingSemantic: false,
      },
      'both': {
        query: 'lightning',
        names: ['Lightning Bolt', 'Lightning Strike', 'Lightning Helix'],
        semantic: [
          { name: 'Shock', type: 'Instant' },
          { name: 'Searing Spear', type: 'Instant' },
          { name: 'Incinerate', type: 'Instant' },
          { name: 'Burst Lightning', type: 'Instant' },
        ],
        loadingSemantic: false,
      },
      'loading': {
        query: 'deal damage to any target',
        names: [],
        semantic: [],
        loadingSemantic: true,
      },
      'semantic-only': {
        query: 'draw three cards and discard one',
        names: [],
        semantic: [
          { name: 'Brainstorm', type: 'Instant' },
          { name: 'Ponder', type: 'Sorcery' },
          { name: 'Preordain', type: 'Sorcery' },
          { name: 'Opt', type: 'Instant' },
        ],
        loadingSemantic: false,
      },
    };

    let currentState = STATES['both'];

    function simulateState(key) {
      document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      currentState = STATES[key];
      const input = document.getElementById('q');
      if (currentState) {
        input.value = currentState.query;
        openDropdown();
      } else {
        input.value = '';
        closeDropdown();
      }
      renderDropdown();
    }

    function handleInput(val) {
      if (!val) { closeDropdown(); currentState = null; return; }
    }

    function handleKey(e) {
      if (e.key === 'Escape') closeDropdown();
      if (e.key === 'Enter') {
        alert(`→ Navigate to /search?q=${encodeURIComponent(e.target.value)}`);
      }
    }

    function openDropdown() {
      const dd = document.getElementById('dropdown');
      dd.classList.add('open');
      renderDropdown();
    }

    function closeDropdown() {
      document.getElementById('dropdown').classList.remove('open');
    }

    function renderDropdown() {
      const dd = document.getElementById('dropdown');
      if (!currentState) { dd.innerHTML = ''; return; }

      const { query, names, semantic, loadingSemantic } = currentState;
      let html = '';

      if (names.length > 0) {
        html += `<div class="section-label">Cards</div>`;
        for (const name of names) {
          html += `<div class="dd-item" onclick="alert('→ Navigate to /card/...')">
            <span>${name}</span>
          </div>`;
        }
      }

      if (names.length > 0 && (semantic.length > 0 || loadingSemantic)) {
        html += `<div class="dd-divider"></div>`;
      }

      if (loadingSemantic) {
        const q = query.length > 24 ? query.slice(0, 24) + '…' : query;
        html += `<div class="section-label semantic">
          About "${q}" <span class="loading-tag">searching…</span>
        </div>`;
      } else if (semantic.length > 0) {
        const q = query.length > 24 ? query.slice(0, 24) + '…' : query;
        html += `<div class="section-label semantic">About "${q}"</div>`;
        for (const card of semantic) {
          html += `<div class="dd-item" onclick="alert('→ Navigate to /card/...')">
            <span>${card.name}</span>
            <span class="type-tag">${card.type}</span>
          </div>`;
        }
        html += `<div class="dd-item all-results" onclick="alert('→ Navigate to /search?q=${encodeURIComponent(query)}')">
          <span>See all results for "${q}"</span>
          <span class="arrow">→</span>
        </div>`;
      } else if (names.length > 0) {
        const q = query.length > 24 ? query.slice(0, 24) + '…' : query;
        html += `<div class="dd-item all-results" onclick="alert('→ Navigate to /search?q=${encodeURIComponent(query)}')">
          <span>Search cards about "${q}"</span>
          <span class="arrow">→</span>
        </div>`;
      }

      dd.innerHTML = html;
      dd.classList.add('open');
    }

    // Init
    simulateState('both');
    document.addEventListener('click', e => {
      if (!e.target.closest('.search-wrap') && !e.target.closest('.demo-controls')) closeDropdown();
    });
  </script>
</body>
</html>
