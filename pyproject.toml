[project]
name = "oracle-tutor"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "numpy>=1.26.0",
  "onnxruntime>=1.20.0",
  "tokenizers>=0.20.0",
  "boto3>=1.35",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.15.7",
  "basedpyright>=1.38.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
