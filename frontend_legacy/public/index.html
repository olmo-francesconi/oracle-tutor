<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OracleTutor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>
    <div class="container">
        <header>
            <h1>OracleTutor</h1>
            <p class="subtitle">Instantly find the closest matching cards</p>
        </header>
        
        <div class="search-container">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search for a card name..."
                    autocomplete="off"
                />
                <div id="suggestions" class="suggestions"></div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 Olmo Francesconi</p>
            <span class="separator">|</span>
            <div class="social-links">
                <a href="#" target="_blank" rel="noopener noreferrer" class="github-link">
                    GitHub
                </a>
            </div>
        </div>
    </footer>
    
    <script src="app.js"></script>
</body>
</html>
