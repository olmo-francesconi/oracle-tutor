name: CI

on:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflow:
              - ".github/workflows/**"
            backend:
              - "backend/**"
            frontend:
              - "frontend/**"

  worker_docker_builds:
    name: Worker Docker builds
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      matrix:
        include:
          - target: ingest
            tag: ot-ingest-worker:ci
          - target: dataset
            tag: ot-dataset-worker:ci
          - target: train
            tag: ot-train-worker:ci
          - target: promote
            tag: ot-promotion-worker:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} worker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.worker
          target: ${{ matrix.target }}
          push: false
          provenance: false
          sbom: false
          tags: ${{ matrix.tag }}

  frontend_build:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  frontend_docker_build:
    name: Frontend Docker build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          provenance: false
          sbom: false
          tags: oracle-tutor-frontend:ci
