name: API CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/api-ci.yml"

jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install deps (frozen)
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest

  docker-build:
    name: Build API container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: docker build -t ot-backend -f backend/Dockerfile backend
