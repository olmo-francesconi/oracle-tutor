services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-mtg_search}
      POSTGRES_USER: ${DB_USER:-oracle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-oracle} -d ${DB_NAME:-mtg_search}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/semantic-artifacts;
      "
    restart: "no"

  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/tests:/app/tests
      - ./backend/src:/app/src
    environment:
      - ORACLE_TUTOR_API_ENV=${ORACLE_TUTOR_API_ENV:-development}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-dev-admin-jwt-secret-change-me-please}
      # Database connection details
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mtg_search}
      - DB_USER=${DB_USER:-oracle}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
      - SEMANTIC_ARTIFACT_ENDPOINT=http://minio:9000
      - SEMANTIC_ARTIFACT_ACCESS_KEY_ID=minioadmin
      - SEMANTIC_ARTIFACT_SECRET_ACCESS_KEY=minioadmin123
      - SEMANTIC_ARTIFACT_BUCKET=semantic-artifacts
      - SEMANTIC_ARTIFACT_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ingest-worker:
    profiles: ["manual"]
    build:
      context: ./backend
      dockerfile: Dockerfile.ingest-worker
    volumes:
      # Keep data directory available if you want to inspect bulk files/logs locally.
      - ./backend/data:/app/data
      - ./backend/src:/app/src
    environment:
      - ORACLE_TUTOR_API_ENV=${ORACLE_TUTOR_API_ENV:-development}
      # Connect to the same DB
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mtg_search}
      - DB_USER=${DB_USER:-oracle}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
      - ORACLE_TUTOR_API_ALLOW_SCHEMA_RESET=${ORACLE_TUTOR_API_ALLOW_SCHEMA_RESET:-true}
      - SEMANTIC_ARTIFACT_ENDPOINT=http://minio:9000
      - SEMANTIC_ARTIFACT_ACCESS_KEY_ID=minioadmin
      - SEMANTIC_ARTIFACT_SECRET_ACCESS_KEY=minioadmin123
      - SEMANTIC_ARTIFACT_BUCKET=semantic-artifacts
      - SEMANTIC_ARTIFACT_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  train-worker:
    profiles: ["manual"]
    build:
      context: ./backend
      dockerfile: Dockerfile.train-worker
    volumes:
      - ./backend/data:/app/data
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    environment:
      - ORACLE_TUTOR_API_ENV=${ORACLE_TUTOR_API_ENV:-development}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mtg_search}
      - DB_USER=${DB_USER:-oracle}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
      - SEMANTIC_ARTIFACT_ENDPOINT=http://minio:9000
      - SEMANTIC_ARTIFACT_ACCESS_KEY_ID=minioadmin
      - SEMANTIC_ARTIFACT_SECRET_ACCESS_KEY=minioadmin123
      - SEMANTIC_ARTIFACT_BUCKET=semantic-artifacts
      - SEMANTIC_ARTIFACT_REGION=us-east-1
      - HF_HOME=/app/data/huggingface
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID:-}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET:-}
      - SEMANTIC_LLM_MODEL=${SEMANTIC_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - SEMANTIC_LLM_MAX_QUERIES_PER_FACE=${SEMANTIC_LLM_MAX_QUERIES_PER_FACE:-3}
      - SEMANTIC_LLM_MAX_FACES=${SEMANTIC_LLM_MAX_FACES:-2500}
      - SEMANTIC_LLM_MIN_TEMPLATE_COVERAGE=${SEMANTIC_LLM_MIN_TEMPLATE_COVERAGE:-2}
      - SEMANTIC_LLM_TEMPERATURE=${SEMANTIC_LLM_TEMPERATURE:-0.6}
      - SEMANTIC_LLM_MAX_TOKENS=${SEMANTIC_LLM_MAX_TOKENS:-500}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  promotion-worker:
    profiles: ["manual"]
    build:
      context: ./backend
      dockerfile: Dockerfile.promotion-worker
    volumes:
      - ./backend/data:/app/data
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    environment:
      - ORACLE_TUTOR_API_ENV=${ORACLE_TUTOR_API_ENV:-development}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mtg_search}
      - DB_USER=${DB_USER:-oracle}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
      - SEMANTIC_ARTIFACT_ENDPOINT=http://minio:9000
      - SEMANTIC_ARTIFACT_ACCESS_KEY_ID=minioadmin
      - SEMANTIC_ARTIFACT_SECRET_ACCESS_KEY=minioadmin123
      - SEMANTIC_ARTIFACT_BUCKET=semantic-artifacts
      - SEMANTIC_ARTIFACT_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      # Vite prefixes env vars with VITE_
      - VITE_API_URL=/api
      - API_PROXY_TARGET=http://api:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/eslint.config.js:/app/eslint.config.js
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
