services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-mtg_search}
      POSTGRES_USER: ${DB_USER:-oracle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-oracle} -d ${DB_NAME:-mtg_search}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/tests:/app/tests
      - ./backend/src:/app/src
    environment:
      - ORACLE_TUTOR_API_ENV=${ORACLE_TUTOR_API_ENV:-development}
      # Database connection details
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mtg_search}
      - DB_USER=${DB_USER:-oracle}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scryfall-sync:
    build:
      context: ./backend
      dockerfile: Dockerfile.scryfall-sync
    volumes:
      # Keep data directory available if you want to inspect bulk files/logs locally.
      - ./backend/data:/app/data
      - ./backend/src:/app/src
    environment:
      - ORACLE_TUTOR_API_ENV=${ORACLE_TUTOR_API_ENV:-development}
      # Connect to the same DB
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mtg_search}
      - DB_USER=${DB_USER:-oracle}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
      - ORACLE_TUTOR_API_ALLOW_SCHEMA_RESET=${ORACLE_TUTOR_API_ALLOW_SCHEMA_RESET:-true}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: "no"

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      # Vite prefixes env vars with VITE_
      - VITE_API_URL=/api
      - API_PROXY_TARGET=http://api:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/eslint.config.js:/app/eslint.config.js
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
