services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-mtg_search}
      POSTGRES_USER: ${DB_USER:-oracle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  api:
    build: ./api
    volumes:
      - ./api/data:/app/data
      - ./api/tests:/app/tests
      - ./api/src:/app/src
    environment:
      - ORACLE_TUTOR_API_ENV=${ORACLE_TUTOR_API_ENV:-development}
      # Database connection details
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mtg_search}
      - DB_USER=${DB_USER:-oracle}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
    depends_on:
      - db
    restart: unless-stopped

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    volumes:
      # Keep data directory available if you want to inspect bulk files/logs locally.
      - ./api/data:/app/data
      - ./api/src:/app/src
    environment:
      - ORACLE_TUTOR_API_ENV=${ORACLE_TUTOR_API_ENV:-development}
      # Connect to the same DB
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mtg_search}
      - DB_USER=${DB_USER:-oracle}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
    depends_on:
      - db
    restart: "no"

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      # Vite prefixes env vars with VITE_
      - VITE_API_URL=/api
      - API_PROXY_TARGET=http://api:8000
    volumes:
      # Sync local files for hot reloading
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
