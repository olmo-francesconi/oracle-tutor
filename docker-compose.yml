services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-mtg_search}
      POSTGRES_USER: ${DB_USER:-oracle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api/data:/app/data
      - ./api/tests:/app/tests
      - ./api/src:/app/src
    environment:
      - ORACLE_TUTOR_API_ENV=${ORACLE_TUTOR_API_ENV:-development}
      # Best-effort: return freed heap pages to OS (Linux/glibc only)
      - ORACLE_TUTOR_API_MALLOC_TRIM=${ORACLE_TUTOR_API_MALLOC_TRIM:-1}
      # Build TF-IDF index in a subprocess so build memory is reclaimed when child exits
      - ORACLE_TUTOR_API_TFIDF_REBUILD_IN_SUBPROCESS=${ORACLE_TUTOR_API_TFIDF_REBUILD_IN_SUBPROCESS:-1}
      # Database connection details
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mtg_search}
      - DB_USER=${DB_USER:-oracle}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
      # Internal worker->API TF-IDF rebuild trigger auth
      - ORACLE_TUTOR_API_WORKER_TOKEN=${ORACLE_TUTOR_API_WORKER_TOKEN:-dev-worker-token}
      # Must match one of API-observed source candidates (Host/client/forwarded headers)
      - ORACLE_TUTOR_API_WORKER_TRIGGER_ALLOWLIST=${ORACLE_TUTOR_API_WORKER_TRIGGER_ALLOWLIST:-api,worker,127.0.0.1,testclient}
      - ORACLE_TUTOR_API_WORKER_REBUILD_PATH=${ORACLE_TUTOR_API_WORKER_REBUILD_PATH:-/internal/rebuild-tfidf}
    depends_on:
      - db
    restart: unless-stopped

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    volumes:
      # Keep data directory available if you want to inspect bulk files/logs locally.
      - ./api/data:/app/data
      - ./api/src:/app/src
    environment:
      - ORACLE_TUTOR_API_ENV=${ORACLE_TUTOR_API_ENV:-development}
      # Connect to the same DB
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mtg_search}
      - DB_USER=${DB_USER:-oracle}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
      # Worker -> API internal TF-IDF rebuild trigger
      - ORACLE_TUTOR_API_BASE_URL=${ORACLE_TUTOR_API_BASE_URL:-http://api:8000}
      - ORACLE_TUTOR_API_WORKER_TOKEN=${ORACLE_TUTOR_API_WORKER_TOKEN:-dev-worker-token}
      - ORACLE_TUTOR_API_WORKER_REBUILD_PATH=${ORACLE_TUTOR_API_WORKER_REBUILD_PATH:-/internal/rebuild-tfidf}
      - ORACLE_TUTOR_API_WORKER_REBUILD_TIMEOUT_SECONDS=${ORACLE_TUTOR_API_WORKER_REBUILD_TIMEOUT_SECONDS:-10}
      - ORACLE_TUTOR_API_ALLOW_SCHEMA_RESET=${ORACLE_TUTOR_API_ALLOW_SCHEMA_RESET:-true}
    depends_on:
      - db
      - api
    restart: "no"

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      # Vite prefixes env vars with VITE_
      - VITE_API_URL=/api
      - API_PROXY_TARGET=http://api:8000
    volumes:
      # Mount only source and config so node_modules stays from image (correct OS/arch for container).
      # Hot reload works for these paths; add new deps in package.json then rebuild the image.
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
