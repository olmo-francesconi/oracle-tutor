# Container-network-only env vars. Anything user-configurable (artifact creds,
# admin password, DB credentials) lives in backend/.env and is loaded via env_file.
x-backend-env: &backend-env
  OT_ENV: ${OT_ENV:-development}
  DB_HOST: db
  DB_PORT: "5432"

x-worker-depends: &worker-depends
  db:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

x-worker-volumes: &worker-volumes
  - ./backend/data:/app/data
  - ./backend/src:/app/src
  - ./backend/alembic:/app/alembic

services:
  db:
    image: pgvector/pgvector:pg17
    # POSTGRES_* read by the postgres image at first-init; values here must match
    # DB_USER/DB_PASSWORD/DB_NAME in backend/.env so the api can connect.
    environment:
      POSTGRES_DB: ${DB_NAME:-mtg_search}
      POSTGRES_USER: ${DB_USER:-oracle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-oracle} -d ${DB_NAME:-mtg_search}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/semantic-artifacts;
      "
    restart: "no"

  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/tests:/app/tests
      - ./backend/src:/app/src
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ingest-worker:
    profiles: ["manual"]
    build:
      context: ./backend
      dockerfile: Dockerfile.worker.ingest
    volumes: *worker-volumes
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend-env
      OT_ALLOW_SCHEMA_RESET: ${OT_ALLOW_SCHEMA_RESET:-true}
    depends_on:
      <<: *worker-depends
      api:
        condition: service_started
    restart: "no"

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/eslint.config.js:/app/eslint.config.js
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
