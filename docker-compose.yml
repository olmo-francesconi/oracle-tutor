services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mtg_search
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  api:
    build: ./api
    volumes:
      - ./api/data:/app/data
      - ./api/tests:/app/tests
      - ./api/src:/app/src
    environment:
      - ORACLE_TUTOR_API_UPDATE_HOUR=2
      # Database connection details
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mtg_search
      - DB_USER=oracle
      - DB_PASSWORD=secret_password
    depends_on:
      - db
    restart: unless-stopped

  # worker:
  #   build:
  #     context: ./api
  #     dockerfile: Dockerfile.worker
  #   volumes:
  #     - ./api/data:/app/data
  #     - ./api/src:/app/src
  #   environment:
  #     - ORACLE_TUTOR_API_UPDATE_HOUR=2
  #     - RUN_ON_STARTUP=true
  #     # Connect to the same DB
  #     - DB_HOST=db
  #     - DB_PORT=5432
  #     - DB_NAME=mtg_search
  #     - DB_USER=oracle
  #     - DB_PASSWORD=secret_password
  #   depends_on:
  #     - db
  #   restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Vite prefixes env vars with VITE_
      - VITE_API_URL=/api
      - API_PROXY_TARGET=http://api:8000
    volumes:
      # Sync local files for hot reloading
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
