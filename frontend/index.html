<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta
      name="description"
      content="Find Magic: The Gathering cards by semantic meaning. Search by what cards do, not just keywords."
    />
    <meta name="theme-color" content="#F0EDE6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Oracle Tutor</title>
    <!-- Default Open Graph / Twitter (for crawlers that don't run JS; app overrides per-route via Helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oracletutor.org/" />
    <meta property="og:title" content="Oracle Tutor" />
    <meta
      property="og:description"
      content="Find Magic: The Gathering cards by semantic meaning. Search by what cards do, not just keywords."
    />
    <meta property="og:image" content="https://oracletutor.org/favicon.svg" />
    <meta property="og:site_name" content="Oracle Tutor" />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oracle Tutor" />
    <meta
      name="twitter:description"
      content="Find Magic: The Gathering cards by semantic meaning. Search by what cards do, not just keywords."
    />
    <meta name="twitter:image" content="https://oracletutor.org/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
