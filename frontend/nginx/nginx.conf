worker_processes auto;

# Must be in the main context (not inside `http {}`), and writable by unprivileged user.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # --- Real client IP behind Cloudflare -> Railway -> Nginx (best-effort) ---
  # We trust the internal proxy hop we observe in logs (CGNAT range 100.64.0.0/10),
  # and then take the client IP from Cloudflare's header.
  #
  # NOTE: If your origin is directly reachable (bypassing Cloudflare), the Real IP
  # header will NOT be trusted because the direct client won't be in 100.64.0.0/10.
  set_real_ip_from 100.64.0.0/10;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  log_format main_ext
    '$remote_addr realip=$realip_remote_addr '
    'cf=$http_cf_connecting_ip xff="$http_x_forwarded_for" '
    '[$time_local] "$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'upstream="$upstream_addr"';

  # Log to stdout/stderr (Railway-friendly)
  access_log /dev/stdout main_ext;
  error_log  /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;

  include /etc/nginx/conf.d/*.conf;
}


