worker_processes auto;

pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  limit_req_zone $binary_remote_addr zone=api_global:10m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=api_search:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=api_semantic:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api_read:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=api_telemetry:10m rate=20r/m;
  limit_conn_zone $binary_remote_addr zone=api_conn:10m;

  map $http_user_agent $is_bot {
    default 0;
    "~*googlebot" 1;
    "~*bingbot" 1;
    "~*yandexbot" 1;
    "~*duckduckbot" 1;
    "~*slurp" 1;
    "~*baiduspider" 1;
    "~*facebookexternalhit" 1;
    "~*twitterbot" 1;
    "~*linkedinbot" 1;
    "~*applebot" 1;
    "~*discordbot" 1;
    "~*telegrambot" 1;
  }

  map $uri $bot_allowed_path {
    default 0;
    "~^/$" 1;
    "~^/robots\.txt$" 1;
    "~^/sitemap\.xml$" 1;
  }

  set_real_ip_from 100.64.0.0/10;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  log_format main_ext
    '$remote_addr realip=$realip_remote_addr '
    'cf=$http_cf_connecting_ip xff="$http_x_forwarded_for" '
    '[$time_local] "$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'upstream="$upstream_addr"';

  access_log /dev/stdout main_ext;
  error_log  /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;

  include /etc/nginx/conf.d/*.conf;
}
