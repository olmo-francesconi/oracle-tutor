<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oracle Tutor — Concept C: Live Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:ital,wght@0,800;0,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F0EDE6;
      --surface: #FFFFFF;
      --ink: #111111;
      --red: #CC1100;
      --yellow: #F5C400;
      --muted: #7A7670;
    }

    body {
      background: var(--bg);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Left stripe ── */
    .stripe {
      position: fixed;
      left: 0; top: 0;
      width: 6px; height: 100%;
      background: var(--red);
      z-index: 50;
    }

    /* ── Three-column layout ── */
    .columns-layout {
      position: fixed;
      inset: 0;
      left: 6px;
      display: grid;
      grid-template-columns: 1fr 1.8fr 1fr;
      z-index: 0;
    }

    /* Column borders */
    .col {
      border-right: 2px solid var(--ink);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .col:last-child { border-right: none; }

    /* Column header */
    .col-header {
      flex-shrink: 0;
      padding: 12px 14px 10px;
      border-bottom: 2px solid var(--ink);
      background: var(--ink);
      display: flex;
      align-items: baseline;
      gap: 10px;
      cursor: pointer;
      transition: background 0.1s;
      z-index: 5;
    }

    .col-header:hover {
      background: var(--red);
    }

    .col-header-label {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--bg);
    }

    .col-header-count {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: rgba(240,237,230,0.5);
      margin-left: auto;
    }

    /* Column scroll area */
    .col-scroll {
      flex: 1;
      overflow: hidden;
      position: relative;
      cursor: crosshair;
    }

    .col-scroll:hover .col-inner {
      animation-play-state: paused;
    }

    .col-inner {
      display: flex;
      flex-direction: column;
      animation: scrollUpFeed linear infinite;
      will-change: transform;
    }

    @keyframes scrollUpFeed {
      from { transform: translateY(0); }
      to   { transform: translateY(-50%); }
    }

    .col-a .col-inner { animation-duration: 88s; animation-delay: -22s; }
    .col-b .col-inner { animation-duration: 65s; animation-delay: -40s; }
    .col-c .col-inner { animation-duration: 105s; animation-delay: -10s; }

    .feed-line {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 11.5px;
      line-height: 1.58;
      color: var(--ink);
      opacity: 0.18;
      padding: 3px 14px 3px 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: opacity 0.1s;
      border-top: 1px solid transparent;
      letter-spacing: 0.008em;
    }

    .feed-line:hover {
      opacity: 1;
      border-top-color: var(--red);
      color: var(--ink);
    }

    /* Center column: slightly more prominent text */
    .col-b .feed-line {
      opacity: 0.16;
      font-size: 12px;
    }

    /* ── Search overlay ── */
    .search-overlay {
      position: fixed;
      inset: 0;
      left: 6px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .search-panel {
      pointer-events: all;
      width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wordmark {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: clamp(48px, 8vw, 78px);
      line-height: 0.92;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--ink);
      text-align: center;
      margin-bottom: 0;
    }

    .wordmark-rule {
      width: 100%;
      height: 2px;
      background: var(--ink);
      margin: 12px 0;
    }

    .wordmark-sub {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .search-wrap {
      width: 100%;
      position: relative;
    }

    .search-input {
      width: 100%;
      font-family: 'DM Mono', monospace;
      font-size: 13.5px;
      color: var(--ink);
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 0;
      padding: 13px 48px 13px 14px;
      outline: none;
      caret-color: var(--red);
      letter-spacing: 0.01em;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .search-input::placeholder { color: var(--muted); }

    .search-btn {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 46px;
      background: var(--ink);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
    }

    .search-btn:hover { background: var(--red); }

    .search-btn svg {
      stroke: var(--bg);
      fill: none;
      width: 17px; height: 17px;
    }

    /* Category filter chips */
    .category-chips {
      display: flex;
      gap: 0;
      margin-top: 14px;
      width: 100%;
    }

    .chip {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 800;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink);
      border: 2px solid var(--ink);
      padding: 5px 10px;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: background 0.1s, color 0.1s;
      margin-left: -2px;
    }

    .chip:first-child { margin-left: 0; }

    .chip:hover {
      background: var(--ink);
      color: var(--bg);
    }

    .chip.active {
      background: var(--red);
      border-color: var(--red);
      color: var(--bg);
    }

    /* Feed controls hint */
    .feed-hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.03em;
      z-index: 30;
      white-space: nowrap;
    }

    /* Pause indicator on hover */
    .col-scroll:hover::after {
      content: '■ PAUSED';
      position: absolute;
      top: 8px; right: 10px;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 800;
      font-size: 8px;
      letter-spacing: 0.14em;
      color: var(--red);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="stripe"></div>

  <!-- Three columns -->
  <div class="columns-layout">
    <!-- Column A: Creature text -->
    <div class="col col-a">
      <div class="col-header" onclick="filterChip('creatures')">
        <span class="col-header-label">Creature Text</span>
        <span class="col-header-count">click to filter →</span>
      </div>
      <div class="col-scroll">
        <div class="col-inner" id="col-a-inner"></div>
      </div>
    </div>

    <!-- Column B: Instant / Sorcery text (center, wider) -->
    <div class="col col-b">
      <div class="col-header" onclick="filterChip('instants')">
        <span class="col-header-label">Instants &amp; Sorceries</span>
        <span class="col-header-count">click to filter →</span>
      </div>
      <div class="col-scroll">
        <div class="col-inner" id="col-b-inner"></div>
      </div>
    </div>

    <!-- Column C: Enchantment / Artifact text -->
    <div class="col col-c">
      <div class="col-header" onclick="filterChip('enchantments')">
        <span class="col-header-label">Enchantments</span>
        <span class="col-header-count">click to filter →</span>
      </div>
      <div class="col-scroll">
        <div class="col-inner" id="col-c-inner"></div>
      </div>
    </div>
  </div>

  <!-- Search overlay -->
  <div class="search-overlay">
    <div class="search-panel">
      <div class="wordmark">Oracle<br>Tutor</div>
      <div class="wordmark-rule"></div>
      <p class="wordmark-sub">find cards by meaning, not keywords.</p>

      <div class="search-wrap">
        <input
          id="search"
          class="search-input"
          type="text"
          placeholder="scry 2 then draw a card..."
          autocomplete="off"
          spellcheck="false"
        />
        <button class="search-btn" title="Search">
          <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <line x1="16.5" y1="16.5" x2="22" y2="22"/>
          </svg>
        </button>
      </div>

      <div class="category-chips">
        <div class="chip" id="chip-all" onclick="filterChip('all')">All</div>
        <div class="chip" id="chip-creatures" onclick="filterChip('creatures')">Creatures</div>
        <div class="chip" id="chip-instants" onclick="filterChip('instants')">Instants</div>
        <div class="chip" id="chip-enchantments" onclick="filterChip('enchantments')">Enchantments</div>
      </div>
    </div>
  </div>

  <div class="feed-hint">hover any column to pause · click text to search · hover is live</div>

  <script>
    const CREATURE_TEXTS = [
      "When {this} enters, draw a card.",
      "Whenever a creature you control dies, create a 1/1 white Spirit token with flying.",
      "At the beginning of your upkeep, put a +1/+1 counter on {this}.",
      "When {this} enters, exile target nonland permanent until {this} leaves.",
      "Whenever {this} deals combat damage to a player, you may draw a card.",
      "When {this} dies, return it to your hand.",
      "Whenever {this} attacks, create a 1/1 white Soldier token that's tapped and attacking.",
      "When {this} enters, target opponent discards two cards.",
      "Whenever you draw a card, you may pay {1}. If you do, create a 1/1 blue Faerie token.",
      "Whenever a land enters under your control, you gain 1 life.",
      "Whenever you cast your second spell each turn, draw a card.",
      "{T}: Add {G}.",
      "{2}, {T}: Draw a card, then discard a card.",
      "{T}: Add one mana of any color.",
      "{1}{T}: Create a 1/1 green Saproling creature token.",
      "{X}{R}: {This} deals X damage to any target.",
      "Flying. Trample.",
      "Deathtouch. Lifelink.",
      "Protection from black and from white.",
      "Hexproof from instants and sorceries.",
      "All creatures you control have vigilance.",
      "Indestructible.",
      "Flash. Ward {2}.",
      "Menace. First strike.",
      "Reach. When {this} blocks a creature with flying, destroy it.",
      "Other creatures you control get +1/+1.",
      "Whenever {this} becomes the target of a spell, put a +1/+1 counter on it.",
      "Modular 1.",
      "Bloodthirst 2.",
      "{2}{T}: Draw a card.",
      "When {this} is put into a graveyard from anywhere, shuffle it into its owner's library.",
    ];

    const INSTANT_TEXTS = [
      "Counter target spell. Its controller draws a card.",
      "Destroy all creatures. They can't be regenerated.",
      "Each player sacrifices two creatures.",
      "Return target creature from your graveyard to the battlefield.",
      "Exile all cards from target player's graveyard.",
      "Search your library for a basic land card, put it onto the battlefield tapped, then shuffle.",
      "Target player mills ten cards.",
      "Tap target creature. It doesn't untap during its controller's next untap step.",
      "Scry 2, then draw a card.",
      "Proliferate.",
      "Choose one — Draw two cards; or target player discards two cards.",
      "Create two 1/1 white Soldier creature tokens with lifelink.",
      "Target creature gets +3/+3 until end of turn.",
      "Prevent all combat damage that would be dealt this turn.",
      "Each opponent loses 3 life and you gain 3 life.",
      "Look at the top seven cards. Put two into your hand, rest on the bottom.",
      "Exile target creature. Its controller creates a 3/3 green Beast token.",
      "Counter target activated or triggered ability.",
      "Destroy target artifact or enchantment.",
      "Double the power of each creature you control until end of turn.",
      "Return all creatures to their owners' hands.",
      "You draw three cards and you lose 3 life.",
      "Exile target instant or sorcery card from a graveyard. Copy it. You may cast the copy.",
      "Cascade.",
      "Flashback {3}{U}.",
      "Buyback {2}{W}.",
      "Split second.",
      "Storm.",
      "Replicate {2}.",
      "Conspire.",
    ];

    const ENCHANTMENT_TEXTS = [
      "Spells you cast cost {1} less to cast.",
      "You have no maximum hand size.",
      "At the beginning of each end step, if you gained life this turn, draw a card.",
      "Whenever you cast an instant or sorcery spell, {this} gets +1/+0 until end of turn.",
      "Creatures you control have lifelink.",
      "Whenever a creature enters under your control, put a +1/+1 counter on it.",
      "Enchanted creature gets +2/+2 and has flying.",
      "Enchanted creature can't attack or block.",
      "Enchanted land becomes a 3/3 creature. It's still a land.",
      "At the beginning of your upkeep, draw a card.",
      "Creatures can't attack you unless their controller pays {2} per creature.",
      "If a source would deal damage to you, prevent 1 of that damage.",
      "Whenever a player draws a card, that player loses 1 life.",
      "Enchanted creature has 'Whenever this creature deals damage to a player, you draw a card.'",
      "You may cast spells as though they had flash.",
      "Land cards you own enter untapped.",
      "Whenever you attack, scry 1.",
      "Creatures your opponents control enter tapped.",
      "You gain 1 life at the beginning of your upkeep for each land you control.",
      "Enchanted creature gains protection from the color of your choice.",
      "Aura.",
      "Constellation — Whenever an enchantment enters under your control, draw a card.",
      "Shroud.",
      "Bestow {4}{U}{U}.",
      "Totem armor.",
      "Enchant player.",
    ];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function fillColumn(elId, texts) {
      const inner = document.getElementById(elId);
      const repeated = [];
      while (repeated.length < 100) repeated.push(...shuffle(texts));
      // Double copy for seamless loop
      const all = [...repeated.slice(0, 50), ...repeated.slice(0, 50)];
      all.forEach(text => {
        const line = document.createElement('span');
        line.className = 'feed-line';
        line.textContent = text;
        line.onclick = () => {
          document.getElementById('search').value = text;
          document.getElementById('search').focus();
        };
        inner.appendChild(line);
      });
    }

    fillColumn('col-a-inner', CREATURE_TEXTS);
    fillColumn('col-b-inner', INSTANT_TEXTS);
    fillColumn('col-c-inner', ENCHANTMENT_TEXTS);

    // Category chips
    function filterChip(type) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      const chipMap = { all: 'chip-all', creatures: 'chip-creatures', instants: 'chip-instants', enchantments: 'chip-enchantments' };
      if (chipMap[type]) document.getElementById(chipMap[type]).classList.add('active');

      // Pre-fill search with type filter as a demonstration
      const searchMap = {
        creatures: 'whenever a creature enters the battlefield',
        instants: 'counter target spell',
        enchantments: 'enchanted creature gets +2/+2',
        all: '',
      };
      const input = document.getElementById('search');
      if (searchMap[type] !== undefined) input.value = searchMap[type];
      input.focus();
    }

    // Default chip active
    document.getElementById('chip-all').classList.add('active');
  </script>
</body>
</html>
