<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oracle Tutor — Art B: The Composition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F0EDE6;
      --surface: #FFFFFF;
      --ink:     #111111;
      --red:     #CC1100;
      --yellow:  #F5C400;
      --muted:   #7A7670;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
    }

    /* ─────────────────────────────────────────────
       Bauhaus horizontal band composition.
       Inspired by Moholy-Nagy color + type studies.
       Four bands of color, each filled with oracle
       text at different scales and densities.
       The white center band holds the UI.
    ───────────────────────────────────────────── */

    /* ── Left stripe ── */
    .left-stripe {
      position: fixed;
      left: 0; top: 0;
      width: 6px; height: 100%;
      background: var(--red);
      z-index: 100;
    }

    /* ── Band layout ── */
    .bands {
      position: fixed;
      inset: 0;
      left: 6px;
      display: flex;
      flex-direction: column;
    }

    /* BAND A — top, ink black
       Oracle text in white, Big Shoulders Display, large uppercase
       Dense, reversed — a bold type block */
    .band-a {
      flex: 0 0 20%;
      background: var(--ink);
      overflow: hidden;
      padding: 0;
      border-bottom: 2px solid var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .band-a-inner {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: clamp(20px, 2.8vw, 38px);
      text-transform: uppercase;
      color: var(--bg);
      opacity: 0.22;
      line-height: 1.08;
      letter-spacing: -0.015em;
      padding: 14px 20px 10px;
      white-space: nowrap;
      overflow: hidden;
    }

    /* BAND B — warm bg color
       Oracle text in ink, DM Mono micro, very faint
       Like a dense annotation layer */
    .band-b {
      flex: 0 0 14%;
      background: var(--bg);
      overflow: hidden;
      padding: 10px 20px 8px;
      border-bottom: 2px solid var(--ink);
    }

    .band-b p {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      line-height: 1.7;
      color: var(--ink);
      opacity: 0.10;
      white-space: nowrap;
      overflow: hidden;
      letter-spacing: 0.01em;
    }

    /* BAND C — white surface: the UI zone
       No oracle text. Pure search canvas.
       Divided from adjacent bands by hard rules. */
    .band-c {
      flex: 0 0 32%;
      background: var(--surface);
      border-bottom: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 32px;
    }

    /* BAND D — warm bg color
       Oracle text, medium size, very low opacity
       Creates texture below the UI */
    .band-d {
      flex: 0 0 16%;
      background: var(--bg);
      overflow: hidden;
      padding: 10px 20px;
      border-bottom: 2px solid var(--ink);
    }

    .band-d p {
      font-family: 'DM Mono', monospace;
      font-size: 9.5px;
      line-height: 1.65;
      color: var(--ink);
      opacity: 0.09;
      white-space: nowrap;
      overflow: hidden;
    }

    /* BAND E — red: reversed oracle text at bottom
       DM Mono, white, small, dense
       Hot, compressed, the Bauhaus red band */
    .band-e {
      flex: 1;
      background: var(--red);
      overflow: hidden;
      padding: 10px 20px;
    }

    .band-e p {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      line-height: 1.7;
      color: var(--surface);
      opacity: 0.30;
      white-space: nowrap;
      overflow: hidden;
      letter-spacing: 0.01em;
    }

    /* ── Search panel (in band C) ── */
    .search-panel {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: flex-start; /* left-aligned: more editorial, less SaaS */
    }

    .wordmark {
      margin-bottom: 24px;
    }

    .wordmark h1 {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: clamp(52px, 8vw, 80px);
      line-height: 0.92;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-transform: uppercase;
    }

    .wordmark .rule {
      width: 100%;
      height: 2px;
      background: var(--ink);
      margin: 12px 0 10px;
    }

    .wordmark p {
      font-family: 'DM Mono', monospace;
      font-size: 11.5px;
      color: var(--muted);
      letter-spacing: 0.015em;
    }

    .search-box {
      width: 100%;
      display: flex;
      align-items: stretch;
      border: 2px solid var(--ink);
    }

    .search-box input {
      flex: 1;
      font-family: 'DM Mono', monospace;
      font-size: 13.5px;
      color: var(--ink);
      background: var(--bg); /* slight warmth — not pure white */
      border: none;
      outline: none;
      padding: 14px 16px;
      caret-color: var(--red);
      letter-spacing: 0.01em;
    }

    .search-box input::placeholder { color: var(--muted); }

    .search-box button {
      width: 50px;
      background: var(--ink);
      border: none;
      border-left: 2px solid var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.1s;
    }

    .search-box button:hover { background: var(--red); }

    .search-box button svg {
      stroke: var(--bg);
      fill: none;
      width: 17px; height: 17px;
    }

    /* ── Yellow accent: a thin vertical on the right ── */
    .yellow-accent {
      position: fixed;
      right: 16px;
      top: 20%;
      bottom: 20%;
      width: 4px;
      background: var(--yellow);
      opacity: 0.7;
      z-index: 50;
    }

    /* ── Labels ── */
    .badge {
      position: fixed;
      top: 10px; right: 24px;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 800;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: var(--surface);
      color: var(--ink);
      border: 2px solid var(--ink);
      padding: 3px 9px;
      z-index: 200;
    }
  </style>
</head>
<body>

  <div class="left-stripe"></div>
  <div class="yellow-accent"></div>
  <div class="badge">B — The Composition</div>

  <!-- Five horizontal bands -->
  <div class="bands">

    <!-- BAND A: Black, large reversed uppercase oracle text -->
    <div class="band-a">
      <div class="band-a-inner" id="band-a-text"></div>
    </div>

    <!-- BAND B: Warm bg, dense micro text -->
    <div class="band-b" id="band-b"></div>

    <!-- BAND C: White — search UI -->
    <div class="band-c">
      <div class="search-panel">
        <div class="wordmark">
          <h1>Oracle<br>Tutor</h1>
          <div class="rule"></div>
          <p>find cards by meaning, not keywords.</p>
        </div>

        <div class="search-box">
          <input
            type="text"
            placeholder="whenever a creature dies, draw a card..."
            autocomplete="off"
            spellcheck="false"
          >
          <button>
            <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <line x1="16.5" y1="16.5" x2="22" y2="22"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- BAND D: Warm bg, medium micro text -->
    <div class="band-d" id="band-d"></div>

    <!-- BAND E: Red, white micro text -->
    <div class="band-e" id="band-e"></div>

  </div>

  <script>
    const TEXTS = [
      "When {this} enters, draw a card.",
      "Whenever a creature you control dies, create a 1/1 white Spirit token with flying.",
      "At the beginning of your upkeep, put a +1/+1 counter on {this}.",
      "Whenever {this} deals combat damage to a player, you may draw a card.",
      "When {this} dies, return it to your hand.",
      "Whenever you cast an instant or sorcery spell, {this} gets +1/+0 until end of turn.",
      "{T}: Add {G}.  {T}: Add one mana of any color.",
      "{3}{B}: Destroy target creature. It can't be regenerated.",
      "{X}{R}: {This} deals X damage to any target.",
      "Flying. Trample. Haste.  Deathtouch. Lifelink.",
      "Protection from black and from white.  Hexproof from instants and sorceries.",
      "All creatures you control have vigilance.  Spells you cast cost {1} less.",
      "Indestructible.  Flash. Ward {2}.  Menace. First strike.",
      "Counter target spell. Its controller draws a card.",
      "Destroy all creatures. They can't be regenerated.",
      "Return target creature from your graveyard to the battlefield.",
      "Search your library for a basic land card, put it onto the battlefield tapped.",
      "Scry 2, then draw a card.  Proliferate.  Cascade.",
      "Choose one — Draw two cards; or target player discards two cards.",
      "Each opponent loses 3 life and you gain 3 life.",
      "Flashback {3}{U}.  Escape — {4}{G}{G}, exile four cards from your graveyard.",
      "Whenever an opponent casts a noncreature spell, you may draw a card.",
      "Sacrifice {this}: Add three mana of any one color.  Cycling {2}.",
      "At the beginning of your draw step, draw an additional card. Then discard a card.",
    ];

    const long = TEXTS.join('  ·  ').repeat(6);

    // Band A: Big Shoulders Display, reversed, uppercase oracle text
    const bandA = document.getElementById('band-a-text');
    bandA.textContent = TEXTS.map(t => t.toUpperCase()).join('  —  ').repeat(4);

    // Band B: micro text rows
    const bandB = document.getElementById('band-b');
    const rowsB = 10;
    for (let i = 0; i < rowsB; i++) {
      const p = document.createElement('p');
      const off = (i * 43) % long.length;
      p.textContent = long.slice(off) + long;
      bandB.appendChild(p);
    }

    // Band D: micro text rows
    const bandD = document.getElementById('band-d');
    const rowsD = 8;
    for (let i = 0; i < rowsD; i++) {
      const p = document.createElement('p');
      const off = (i * 61 + 200) % long.length;
      p.textContent = long.slice(off) + long;
      bandD.appendChild(p);
    }

    // Band E: red band, white micro text
    const bandE = document.getElementById('band-e');
    const rowsE = 6;
    for (let i = 0; i < rowsE; i++) {
      const p = document.createElement('p');
      const off = (i * 79 + 400) % long.length;
      p.textContent = long.slice(off) + long;
      bandE.appendChild(p);
    }
  </script>
</body>
</html>
