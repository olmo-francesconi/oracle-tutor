[project]
name = "oracle-tutor-api"
version = "1.4.0"
description = "FastAPI service for MTG oracle search (uv-managed)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "hypercorn>=0.17.0",
  "uvicorn[standard]>=0.32.0",
  "sentence-transformers>=3.0",
]
worker = [
  "requests>=2.32.0",
  "ijson>=3.3.0",
  "pgvector>=0.3",
]

[dependency-groups]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "requests>=2.32.0",
  "ijson>=3.3.0",
  "ruff>=0.15.7",
  "basedpyright>=1.38.3",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, isort
ignore = ["E501"]          # line length handled by formatter
