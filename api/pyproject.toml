[project]
name = "oracle-tutor-api"
version = "0.0.1"
description = "Barebones FastAPI service (uv-managed)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"


