[project]
name = "oracle-tutor-api"
version = "0.0.1"
description = "Barebones FastAPI service (uv-managed)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "hypercorn>=0.17.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "requests>=2.32.0",
  "ijson>=3.3.0",
  "cachetools>=5.5.0",
  "apscheduler>=3.10.0",
  "scikit-learn>=1.5.0",
]

[dependency-groups]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"


