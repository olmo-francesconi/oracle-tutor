services:
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    image: mtg-search-worker
    restart: "no"
    volumes:
      # Persist data/logs if needed, though for a pure worker it might not be strictly necessary
      # unless you want to inspect downloaded files
      - ./api/data:/app/data
    environment:
      # Connect to Remote DB (Load from .env)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # Optional worker -> API internal TF-IDF rebuild trigger
      - ORACLE_TUTOR_API_BASE_URL=${ORACLE_TUTOR_API_BASE_URL:-}
      - ORACLE_TUTOR_API_WORKER_TOKEN=${ORACLE_TUTOR_API_WORKER_TOKEN:-}
      - ORACLE_TUTOR_API_WORKER_REBUILD_PATH=${ORACLE_TUTOR_API_WORKER_REBUILD_PATH:-/internal/rebuild-tfidf}
      - ORACLE_TUTOR_API_WORKER_REBUILD_TIMEOUT_SECONDS=${ORACLE_TUTOR_API_WORKER_REBUILD_TIMEOUT_SECONDS:-10}