services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - ORACLE_TUTOR_API_ENV=production
      # Best-effort: return freed heap pages to OS (Linux/glibc only)
      - ORACLE_TUTOR_API_MALLOC_TRIM=${ORACLE_TUTOR_API_MALLOC_TRIM:-1}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:?set DB_NAME}
      - DB_USER=${DB_USER:?set DB_USER}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      # Internal worker->API TF-IDF rebuild trigger auth
      - ORACLE_TUTOR_API_WORKER_TOKEN=${ORACLE_TUTOR_API_WORKER_TOKEN:?set ORACLE_TUTOR_API_WORKER_TOKEN}
      - ORACLE_TUTOR_API_WORKER_TRIGGER_ALLOWLIST=${ORACLE_TUTOR_API_WORKER_TRIGGER_ALLOWLIST:?set ORACLE_TUTOR_API_WORKER_TRIGGER_ALLOWLIST}
      - ORACLE_TUTOR_API_WORKER_REBUILD_PATH=${ORACLE_TUTOR_API_WORKER_REBUILD_PATH:-/internal/rebuild-tfidf}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - api_data:/app/data

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    environment:
      - ORACLE_TUTOR_API_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:?set DB_NAME}
      - DB_USER=${DB_USER:?set DB_USER}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      # Worker -> API internal TF-IDF rebuild trigger
      - ORACLE_TUTOR_API_BASE_URL=${ORACLE_TUTOR_API_BASE_URL:-http://api:8000}
      - ORACLE_TUTOR_API_WORKER_TOKEN=${ORACLE_TUTOR_API_WORKER_TOKEN:?set ORACLE_TUTOR_API_WORKER_TOKEN}
      - ORACLE_TUTOR_API_WORKER_REBUILD_PATH=${ORACLE_TUTOR_API_WORKER_REBUILD_PATH:-/internal/rebuild-tfidf}
      - ORACLE_TUTOR_API_WORKER_REBUILD_TIMEOUT_SECONDS=${ORACLE_TUTOR_API_WORKER_REBUILD_TIMEOUT_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - api_data:/app/data

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - API_PROXY_TARGET=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx

volumes:
  postgres_data:
  api_data:

